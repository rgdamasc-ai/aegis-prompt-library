# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "CP03 + CP09 — Causa-raiz do Cerebro: LLM-as-judge com rubrica de 4 critérios (escala 0-2, corte ≥ 6)"

prompts:
  - file://./prompt.md

providers:
  - id: google:gemini-2.5-flash-lite
    config:
      temperature: 0.0

defaultTest:
  assert:
    # Limite de latência — análise complexa, threshold mais generoso
    - type: latency
      threshold: 30000

tests:
  - description: "Degradação do Cerebro — reindexação travada saturando o heap"
    vars:
      config_sistema: |
        # cerebro.yaml — configuração do cluster Elasticsearch
        cerebro:
          shards: 12
          replicas_per_shard: 1
          jvm_heap: 8g
          refresh_interval: 1s
          reindex_job:
            schedule: "0 2 * * *"     # roda todo dia às 02:00
            avg_duration_min: 90      # normalmente termina ~03:30
          query_cache:
            enabled: true
            size_mb: 512
      metricas: |
        timestamp              search_p99_ms   indexed_docs_per_s   heap_used_pct   cache_hit_pct
        2026-05-13 08:00 UTC   850             4200                 61              74
        2026-05-13 08:30 UTC   1100            4100                 68              71
        2026-05-13 09:00 UTC   2300            9800                 79              58
        2026-05-13 09:30 UTC   4100            11200                88              41
        2026-05-13 10:00 UTC   6700            12400                94              29
      logs: |
        [2026-05-13T08:02:11][INFO ][LoggingTaskListener][cerebro-node-3] reindex task [88123] (scheduled 02:00) progress, created [3.8M]/[10M] docs (38%)
        [2026-05-13T08:14:33][WARN ][JvmGcMonitorService][cerebro-node-3] [gc][young] duration [620ms], collections [1] in [10s], heap [4.9gb]->[3.1gb]/[8gb]
        [2026-05-13T08:41:07][INFO ][IndexingMemoryController][cerebro-node-3] now throttling indexing for shard [logs-2026.05][7]: segment writing can't keep up
        [2026-05-13T09:03:55][WARN ][ThreadPool][cerebro-node-3] write thread pool queue at [150/200]
        [2026-05-13T09:12:48][WARN ][JvmGcMonitorService][cerebro-node-3] [gc][old] duration [1.1s], collections [2] in [60s], heap [6.3gb]->[5.9gb]/[8gb]
        [2026-05-13T09:20:02][INFO ][LoggingTaskListener][cerebro-node-3] reindex task [88123] (scheduled 02:00) progress, created [4.0M]/[10M] docs (40%)
        [2026-05-13T09:31:17][WARN ][HierarchyCircuitBreakerService][cerebro-node-3] [parent] usage [6.9gb/8gb] (86%), approaching limit
        [2026-05-13T09:44:29][WARN ][SearchService][cerebro-node-3] slow query on shard [logs-2026.05][7] took [2380ms]
        [2026-05-13T09:51:08][WARN ][ThreadPool][cerebro-node-3] write thread pool queue at [188/200]
        [2026-05-13T09:58:41][WARN ][ThreadPool][cerebro-node-3] write thread pool full [200/200], rejecting bulk — EsRejectedExecutionException
        [2026-05-13T09:58:43][WARN ][JvmGcMonitorService][cerebro-node-3] [gc][old] duration [1.8s], collections [4] in [60s], heap [7.6gb]->[7.4gb]/[8gb]
        [2026-05-13T09:58:44][INFO ][LoggingTaskListener][cerebro-node-3] reindex task [88123] (scheduled 02:00) still running, created [4.1M]/[10M] docs (41%), ETA unknown
        [2026-05-13T09:58:45][WARN ][IndexingMemoryController][cerebro-node-3] indexing buffer above limit, throttling shard [logs-2026.05][7]
        [2026-05-13T09:58:46][DEBUG][QueryPhase][cerebro-node-3] shard [logs-2026.05][7] search took [5031ms] (timeout [5000ms])
        [2026-05-13T09:58:46][ERROR][SearchService][cerebro-node-3] search returned partial results: 11/12 shards succeeded
        [2026-05-13T09:58:46][WARN ][HierarchyCircuitBreakerService][cerebro-node-3] [parent] circuit breaker tripped, usage [7.7gb/8gb] (96%) over limit
        [2026-05-13T09:58:47][WARN ][IndicesQueryCache][cerebro-node-3] query cache eviction rate spiking, hit_ratio dropped to 0.29
        [2026-05-13T10:01:12][ERROR][SearchService][cerebro-node-3] CircuitBreakingException: [parent] Data too large, would be [7.9gb/8gb]
        [2026-05-13T10:03:39][WARN ][ThreadPool][cerebro-node-3] write thread pool rejected [1284] bulk requests in last 5min
        [2026-05-13T10:05:50][ERROR][SearchService][cerebro-node-3] all shards failed for index [logs-2026.05] on 3 of last 20 queries
    assert:
      # Gate de qualidade — LLM-as-judge com rubrica de 4 critérios
      # Rubrica: 4 critérios × escala 0-2 = máximo 8 pontos
      # Aprovação: total ≥ 6 E nenhum critério zerado
      - type: llm-rubric
        provider: google:gemini-2.5-flash-lite
        value: |
          Avalie a análise de causa-raiz abaixo em quatro critérios.
          Para cada critério, atribua uma nota de 0 a 2:
            0 = não atende (ausente ou fundamentalmente errado)
            1 = parcialmente atende (incompleto ou impreciso)
            2 = atende plenamente

          CRITÉRIO 1 — Causa-raiz correta (0-2):
          A análise identifica a causa real: o job de reindexação agendado às 02:00 não concluiu dentro
          da janela esperada (~03:30) e continuou rodando durante o horário comercial, saturando
          progressivamente o heap da JVM de 8g. NÃO é aceitável identificar apenas os sintomas
          (GC pressure, circuit breaker, cache miss) como causa-raiz.

          CRITÉRIO 2 — Correlação × causa (0-2):
          A análise separa explicitamente o que é causa do que é consequência.
          Exemplos de consequências que NÃO devem ser tratadas como causas:
          - heap subindo: consequência da reindexação contínua
          - cache hit caindo: consequência da pressão de memória
          - thread pool saturando: consequência do heap alto e GC pressure
          - circuit breaker disparando: consequência final da cadeia
          A nota é 0 se a análise lista consequências como causas sem distinguir.

          CRITÉRIO 3 — Ação proporcional (0-2):
          A ação recomendada é coerente com o diagnóstico.
          Esperado: cancelar ou pausar o job de reindexação em andamento (contenção imediata)
          E pelo menos UMA correção estrutural (ex.: throttling do job, alerta de duração, revisão do heap).
          A nota é 0 se a ação não menciona o job de reindexação.

          CRITÉRIO 4 — Honestidade epistêmica (0-2):
          A análise reconhece o que os dados NÃO permitem concluir.
          Esperado: declarar que não sabemos POR QUE o job de reindexação atrasou tanto
          (não há log de causa do atraso — a causa do atraso é uma lacuna de diagnóstico).
          A nota é 0 se a análise fabrica certeza sem evidência sobre a causa do atraso.

          CRITÉRIO DE APROVAÇÃO: total ≥ 6 E nenhum critério zerado.
          Responda com:
          - As notas individuais de cada critério
          - O total
          - Se PASSA ou FALHA
          - Uma frase por critério justificando a nota
