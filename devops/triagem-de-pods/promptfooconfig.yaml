# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "CP01 — Triagem de pods: valida causa provável e ação recomendada para os três cenários de entrada"

prompts:
  - file://./prompt.md

providers:
  - id: google:gemini-2.5-flash-lite
    config:
      temperature: 0.0

defaultTest:
  assert:
    # Limite operacional de latência: resposta em até 15s
    - type: latency
      threshold: 15000

tests:
  # Entrada 1 — pod em CrashLoopBackOff por OOMKilled
  - description: "Entrada 1: pod reiniciando por OOMKilled — deve citar o pod e causa de memória"
    vars:
      snapshot_cluster: |
        $ kubectl get pods -n sentinel-prod
        NAME                            READY   STATUS             RESTARTS       AGE
        sentinel-api-7d9c8b6f4-2xk9p    1/1     Running            0              6d
        sentinel-api-7d9c8b6f4-h4m2t    0/1     CrashLoopBackOff   14 (90s ago)   42m
        sentinel-worker-5b8f9c8d-jq7rs  1/1     Running            0              6d
        sentinel-scheduler-6c4d7f-nn8vx 1/1     Running            0              6d

        $ kubectl describe pod sentinel-api-7d9c8b6f4-h4m2t -n sentinel-prod
            State:          Waiting
              Reason:       CrashLoopBackOff
            Last State:     Terminated
              Reason:       OOMKilled
              Exit Code:    137
            Limits:         memory: 512Mi
            Requests:       memory: 256Mi
        Events:
          Type     Reason   Age                 From     Message
          ----     ------   ----                ----     -------
          Warning  BackOff  2m (x18 over 40m)   kubelet  Back-off restarting failed container api

        $ kubectl logs sentinel-api-7d9c8b6f4-h4m2t -n sentinel-prod --previous
        2026-05-13 10:14:02 [INFO]  [api] startup complete, version 2.9.1
        2026-05-13 10:14:48 [INFO]  [cache] loading 6h alert cache (heap 410Mi/512Mi)
        2026-05-13 10:15:10 [WARN]  [runtime] high GC pressure, heap 498Mi/512Mi
        2026-05-13 10:15:12 [FATAL] [runtime] out of memory, shutting down process
    assert:
      # Deve mencionar o nome do pod problemático
      - type: contains
        value: "sentinel-api-7d9c8b6f4-h4m2t"
      # Deve referenciar OOMKilled ou memória como causa
      - type: javascript
        value: "/(OOMKilled|out of memory|mem[oó]ria|memory limit|512Mi)/i.test(output)"
      # Não deve classificar os pods saudáveis como problemáticos
      - type: not-contains
        value: "sentinel-api-7d9c8b6f4-2xk9p"
      # Deve ter o campo POD: no output
      - type: contains
        value: "POD:"
      # Deve ter o campo CAUSA PROVÁVEL:
      - type: contains
        value: "CAUSA PROVÁVEL:"
      # Deve ter o campo AÇÃO RECOMENDADA:
      - type: contains
        value: "AÇÃO RECOMENDADA:"

  # Entrada 2 — dois pods problemáticos: ImagePullBackOff e Pending
  - description: "Entrada 2: ImagePullBackOff e Pending — deve citar ambos os pods e causas distintas"
    vars:
      snapshot_cluster: |
        $ kubectl get pods -n sentinel-prod
        NAME                            READY   STATUS             RESTARTS   AGE
        sentinel-api-7d9c8b6f4-2xk9p    1/1     Running            0          6d
        sentinel-api-7d9c8b6f4-zzp10    0/1     ImagePullBackOff   0          8m
        sentinel-ingest-8f7a9c5b-4dkqm  0/1     Pending            0          8m
        sentinel-scheduler-6c4d7f-nn8vx 1/1     Running            0          6d

        $ kubectl describe pod sentinel-api-7d9c8b6f4-zzp10 -n sentinel-prod
            State:    Waiting
              Reason: ImagePullBackOff
            Image:    registry.aegis.io/sentinel-api:2.9.2
        Events:
          Type     Reason   Age   From     Message
          ----     ------   ----  ----     -------
          Warning  Failed   7m    kubelet  Failed to pull image "registry.aegis.io/sentinel-api:2.9.2": manifest unknown
          Warning  Failed   7m    kubelet  Error: ErrImagePull
          Normal   BackOff  6m    kubelet  Back-off pulling image "registry.aegis.io/sentinel-api:2.9.2"

        $ kubectl describe pod sentinel-ingest-8f7a9c5b-4dkqm -n sentinel-prod
            State:    Waiting
              Reason: Pending
            Requests: cpu: 2
        Events:
          Type     Reason            Age   From               Message
          ----     ------            ----  ----               -------
          Warning  FailedScheduling  7m    default-scheduler  0/6 nodes are available: 6 Insufficient cpu
    assert:
      # Deve mencionar o pod com ImagePullBackOff
      - type: contains
        value: "sentinel-api-7d9c8b6f4-zzp10"
      # Deve mencionar o pod Pending
      - type: contains
        value: "sentinel-ingest-8f7a9c5b-4dkqm"
      # Deve mencionar a tag da imagem ou ImagePullBackOff como causa
      - type: javascript
        value: "/(2\\.9\\.2|ImagePullBackOff|manifest unknown|imagem)/i.test(output)"
      # Deve mencionar CPU insuficiente como causa
      - type: javascript
        value: "/(Insufficient cpu|cpu insuf|sem cpu|recursos)/i.test(output)"
      # Não deve classificar o pod saudável como problemático
      - type: not-contains
        value: "sentinel-api-7d9c8b6f4-2xk9p"

  # Entrada 3 — cluster saudável: não deve reportar nenhum pod como problemático
  - description: "Entrada 3: cluster saudável — deve declarar que não há pods problemáticos"
    vars:
      snapshot_cluster: |
        $ kubectl get pods -n sentinel-prod
        NAME                            READY   STATUS    RESTARTS     AGE
        sentinel-api-7d9c8b6f4-2xk9p    1/1     Running   0            6d
        sentinel-api-7d9c8b6f4-h4m2t    1/1     Running   0            6d
        sentinel-worker-5b8f9c8d-jq7rs  1/1     Running   1 (3d ago)   6d
        sentinel-scheduler-6c4d7f-nn8vx 1/1     Running   0            6d

        $ kubectl logs sentinel-api-7d9c8b6f4-2xk9p -n sentinel-prod --tail=3
        2026-05-13 11:02:31 [INFO] [api] health check OK, 0 errors in the last 5min
        2026-05-13 11:03:31 [INFO] [api] processed 4.2k alerts/min, p99 latency 120ms
        2026-05-13 11:04:31 [INFO] [api] health check OK
    assert:
      # Deve indicar que o cluster está saudável
      - type: javascript
        value: "/(saud[aá]vel|healthy|nenhum pod|sem problema|não há|nao ha)/i.test(output)"
      # Não deve classificar nenhum pod como problemático com o campo POD:
      - type: javascript
        value: |
          const lines = output.split('\n');
          const podLines = lines.filter(l => l.trim().startsWith('POD:'));
          return podLines.length === 0;
      # Não deve mencionar CrashLoopBackOff ou ImagePullBackOff como problema
      - type: javascript
        value: "!/(CrashLoopBackOff|ImagePullBackOff)/i.test(output)"
